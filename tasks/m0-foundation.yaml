# Schema: Design/ImplementationPlan.md §3    Validate: python3 Tools/CheckTaskDag.py tasks/m0-foundation.yaml
#
# Commands under `verify` that name msbuild, vstest or RunClangTidy are what CI runs on the pull
# request; an agent session runs on Linux and reads their result off the PR (ImplementationPlan.md §2).
# Everything else under `verify` runs in the session before the push.

plan: m0-foundation
title: M0 Foundation - the tree takes its shape, its checkers, a deterministic tick, a landscape and a frame
phase: 0
summary: >
  What M0 proves (GameDesign.md §12): a window presents a scene target and CI captures the same
  scene headless on WARP; the simulation ticks deterministically and hashes; every library has a
  test suite; every checker AGENTS.md names exists and runs in CI; the landscape tool measures the
  generator's guarantees; the generator produces heights and the renderer draws them. No game
  content.

  The shape is TechnicalDesign.md §2: eight projects, one solution, x64 only, toolset v145, and
  the edges of the diagram there. The first task creates the solution with Core alone and writes
  ADR-001 for all eight, so that the second, adding the other seven, is mechanical.

  Every task here is executed from a Linux session that cannot build (OpenQuestions.md R1):
  the checkers and tools are written to run on both Linux and Windows, the C++ is written to
  compile first time and CI is what compiles it. A task is done when CI is green on the PR that
  lands it and every acceptance line below holds; nothing here is "builds clean, not run" unless
  the line says so.

  Reading order for anyone starting a task: AGENTS.md, Design/ImplementationPlan.md §1-§4, then
  the design sections the task's intent cites.

tasks:
  - id: T1
    title: Create the solution, Core and CoreTests, and write ADR-001 for the whole layout
    intent: >
      The tree gets its first buildable shape and the decision that fixes the other seven
      projects before they exist, so that adding them is mechanical and nobody re-argues an edge
      later. AGENTS.md §2 says the concrete layout is recorded there and in an ADR when the first
      project is created; this is that moment.
    project: Core
    depends_on: []
    files:
      - FrontierCommander.slnx
      - Core/Core.vcxproj
      - Core/Core.vcxproj.filters
      - Core/pch.h
      - Core/pch.cpp
      - Core/WindowsHeader.h
      - Core/Assert.h
      - Core/Assert.cpp
      - Tests/CoreTests/CoreTests.vcxproj
      - Tests/CoreTests/CoreTests.vcxproj.filters
      - Tests/CoreTests/pch.h
      - Tests/CoreTests/pch.cpp
      - Tests/CoreTests/SuiteSmoke.cpp
      - .clang-tidy
      - AGENTS.md
      - Design/ADR/README.md
      - Design/ADR/ADR-001-solution-layout.md
      - Design/TechnicalDesign.md
    acceptance:
      - FrontierCommander.slnx is the only solution at the repository root and carries exactly two configurations, Debug|x64 and Release|x64
      - 'Core.vcxproj states, identically in both configurations: PlatformToolset v145, LanguageStandard stdcpplatest, ConformanceMode true, WarningLevel Level4, TreatWarningAsError true, FloatingPointModel Precise, EnableEnhancedInstructionSet AdvancedVectorExtensions2, CharacterSet Unicode, a precompiled header pch.h, OutDir $(SolutionDir)x64\$(Configuration)\ and an IntDir under it per project'
      - The two configurations differ in nothing outside the set AGENTS.md §3 enumerates (Optimization, _DEBUG/NDEBUG, FunctionLevelLinking, IntrinsicFunctions, UseDebugLibraries, RuntimeLibrary, LinkIncremental, WholeProgramOptimization, EnableCOMDATFolding, OptimizeReferences)
      - No project file defines any of the Windows macro family; Core/WindowsHeader.h is the one header that defines NOMINMAX, WIN32_LEAN_AND_MEAN, NODRAWTEXT, NOGDI, NOBITMAP, NOMCX, NOSERVICE and NOHELP before including windows.h, and a grep for those names finds only that file
      - Core/Assert.h defines FRONTIER_ASSERT and FRONTIER_VERIFY, breaking into the debugger in Debug and compiling to nothing (FRONTIER_ASSERT) or to the expression alone (FRONTIER_VERIFY) in Release
      - Tests/CoreTests is a DynamicLibrary on the Microsoft Native Unit Test Framework, references Core, holds a SuiteSmoke test, and builds to x64\Debug\CoreTests.dll, which CI's "Run the tests" step runs green
      - .clang-tidy's HeaderFilterRegex alternation names all eight project directories of ADR-001 plus the Tests pattern, not only the two seeded today
      - "ADR-001 follows Design/ADR/README.md's template and fixes: the eight projects and their kinds, the edges of TechnicalDesign.md §2 as the only permitted ProjectReferences and includes, the namespaces Frontier and Neuron per project, Tests/<Name>Tests per static library, the OutDir/IntDir convention, the platform-header rule (Sim, Content, Net and Replica include no Windows, D3D, socket or WinRT header), and that the render-view and height-view aggregates live in Core so that Replica produces them and Client consumes them without an edge between the two (TechnicalDesign.md §6.3)"
      - AGENTS.md §2 records the layout in the paragraph that says it is settled when the first project is created, Design/ADR/README.md no longer says there are none, and TechnicalDesign.md §2 cites ADR-001
      - CI's Build step runs (the solution guard lifts) and every job is green on the PR
    verify:
      - python3 Tools/CheckTaskDag.py
      - msbuild FrontierCommander.slnx /p:Configuration=Debug /p:Platform=x64 /m /warnaserror
      - vstest.console.exe x64\Debug\*Tests.dll /Platform:x64
    parallel_safe: false
    status: done
    notes: >
      Written by hand from the MSBuild schema, in the shape ADR-001 describes: one unconditional
      property group and item-definition group for everything that is not optimisation, and the
      enumerated differences under a Condition. Two things the Species tree taught that the
      acceptance did not say: the test project sets ProjectSubType NativeUnitTestProject and lists no
      UnitTest\include directory, because the wizard's $(VCInstallDir)UnitTest\include does not exist
      in Visual Studio 2026 and Microsoft.Cpp.UnitTest.props supplies the real paths; and the test
      pch includes Core/pch.h, then WindowsHeader.h, then CppUnitTest.h, because the framework pulls
      in windows.h and the macro family has to be set first. The SuiteSmoke test exercises
      FRONTIER_VERIFY so that a suite whose library does not link cannot pass.

      Nothing here was compiled in the session (OpenQuestions R1): Assert.h was syntax-checked with
      clang under both _DEBUG and NDEBUG, the project files were parsed as XML, and CI on the pull
      request is the first build. AGENTS.md's three sentences about an empty tree and the missing
      ADRs were updated, and the .clang-tidy registry names all eight projects; .clang-tidy is CRLF
      in the working tree per .gitattributes, and the edit kept it so.

            CI on 2026-09-17 (run 35260271356, job Debug|x64 in 74 s): the solution built, vstest ran
            CoreTests and reported 1 test passed (TheSuiteRunsAndTheLibraryLinks), the format job passed
            over the eight C++ files, and the plan validation passed. Marked done on that run.
