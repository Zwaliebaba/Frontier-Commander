      - MulDiv, Sqrt (exact integer floor), Dot and LengthSquared take int32 operands and widen to int64 internally; no float or double appears in any of these headers
      - BinaryAngle is a std::uint16_t turn; Sin and Cos read a 1,024-entry table of 16.16 fixed-point values with linear interpolation; the table header is generated by Tools/GenerateSinTable.py, which is committed, and the header says so and is never edited by hand
      - "Tests: Sqrt exhaustively over 0..2^20 and at the int32 limits against an int64 reference; MulDiv at the overflow boundaries; Sin and Cos at every table entry against the generator's integers, symmetric identities at quarter turns, and a stated maximum interpolation error"
      - CI green with the new tests counted in the test results
