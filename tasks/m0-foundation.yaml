      - "Registration: every .cpp and .h in a project directory is listed in that .vcxproj and its .filters, and every listed file exists; no C++ file sits in a subdirectory other than Shaders/ and CompiledShaders/; CompiledShaders/ is never listed as source"
      - "Names and spellings: R7 file names (PascalCase, the wizard exceptions allowed); R2 type affixes (a class, struct or enum named I<Pascal>, C<Pascal>, S<Pascal>, E<Pascal>, <Pascal>Base, <Pascal>Abstract, <Pascal>Impl or ending in _t) in headers; R11 spelling families in identifiers, checked against the SDK spellings AGENTS.md lists"
