      - "The conformance set under Tests/CoreTests/JsonFixtures.h is written for this repository: at least forty documents that must parse (every value kind, whitespace forms, escapes, deep but legal nesting, large and negative and exponent numbers) and at least forty that must fail with the expected line and column"
    verify:
