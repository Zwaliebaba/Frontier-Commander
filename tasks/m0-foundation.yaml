  - id: T3
    title: Write Build/CheckFormat.py
    intent: >
      The formatting gate AGENTS.md §4 and §6 lean on exists and runs in CI's Linux job, so
      that from the first translation unit the tree is formatted by a machine and never argued
      about. It runs in a Linux session too, which is where the agent writes the code.
    project: Build
    depends_on: []
    files:
      - Build/CheckFormat.py
    acceptance:
      - Runs on Linux (python3) and Windows (python) on the standard library alone
      - Accepts --clang-format <binary> (default clang-format on PATH) and --fix; prints the clang-format version it used and warns when it is not 18.x, which is what the CI job pins
      - Checks every .cpp and .h under the repository except .git/, x64/, CompiledShaders/ and Client/d3dx12.h, lists every file that would change, and exits 1 if any would and 0 otherwise, including on a tree with no C++ at all
      - --fix rewrites the offenders in place and exits 0
      - The CI format job's guard lifts and the job is green on the PR
    verify:
      - python3 Tools/CheckTaskDag.py
      - python3 Build/CheckFormat.py --clang-format clang-format-18
    parallel_safe: true
    status: done
    notes: >
      Exercised in the session on an empty tree (exit 0, "nothing to check"), on a temporary tree
      with a badly formatted file (exit 1, the file listed, x64/, CompiledShaders/ and
      Client/d3dx12.h skipped), with --fix (rewritten, then exit 0) and with a missing binary (exit
