      - Tests/CoreTests/CoreTests.vcxproj.filters
    acceptance:
      - SlotMap<T> over a std::vector (R15) with a free list; Insert returns a Handle of index and generation, Erase bumps the generation, and Resolve of a stale handle returns null
      - Iteration order depends only on the sequence of inserts and erases, and an ascending-key traversal exists for the hash and the snapshot, where the key is the caller's creation counter stored with the element
      - "Tests: reuse after erase, generation wrap, a stale handle after reuse, identical iteration for identical histories, ascending-key traversal after out-of-order erases"
