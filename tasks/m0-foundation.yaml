  - id: T10
    title: Core byte stream - a bounded, versioned reader and writer
    intent: >
      Snapshots, replays and the wire share one serialisation with explicit bounds, so that a
      truncated or hostile buffer yields a failed read rather than a read past the end, which is
      the defect class the Species transport work spent its first task closing.
    project: Core
    depends_on: [T1]
    files:
      - Core/ByteWriter.h
      - Core/ByteWriter.cpp
      - Core/ByteReader.h
      - Core/ByteReader.cpp
      - Core/Core.vcxproj
      - Core/Core.vcxproj.filters
      - Tests/CoreTests/ByteStreamTests.cpp
      - Tests/CoreTests/CoreTests.vcxproj
      - Tests/CoreTests/CoreTests.vcxproj.filters
    acceptance:
      - Little-endian fixed-width integers of every width, byte spans with a length prefix, and a stream header of magic and version; ByteReader reads against the real buffer length and reports failure through a return value, never an exception, and a failed reader stays failed
      - Unaligned access goes through memcpy, never a pointer cast; only trivially copyable types cross the stream, enforced with a static_assert
      - "Tests: round trips of every width, truncation at every byte of a record, a length prefix larger than the buffer, a version mismatch, and pinned bytes for one record so a layout change is a visible diff"
    verify:
      - python3 Tools/CheckTaskDag.py
      - python3 Build/CheckFormat.py --clang-format clang-format-18
      - python3 Build/CheckProjectFiles.py
      - msbuild FrontierCommander.slnx /p:Configuration=Debug /p:Platform=x64 /m /warnaserror
      - vstest.console.exe x64\Debug\*Tests.dll /Platform:x64
    parallel_safe: true
    status: todo

