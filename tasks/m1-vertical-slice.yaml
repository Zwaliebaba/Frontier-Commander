    acceptance:
      - A device advances along its path by its speed in subunits per tick, scaled by the terrain factor of its drive on the cell it is on, turns its heading toward the path at a rate in binary angle per tick, and sits at the heightfield's height
      - Separation steering between devices within a radius in integer arithmetic, with a deterministic tie-break by id; a device that cannot make progress for a stated number of ticks re-plans
      - "Move arrives and stops; AttackMove and Patrol advance until S10 interrupts them; Guard returns to its position; Stop clears the path"
      - "Tests: a light on wheels with a machine gun crosses a flat 8,192-unit Small landscape in about 1,575 ticks; a tracked device refuses a 45 percent slope and a wheeled one a 30 percent slope; two devices meeting head-on pass; two Sims move identically"
    verify:
      - python3 Tools/CheckTaskDag.py
      - python3 Build/CheckFormat.py --clang-format clang-format-18
      - python3 Build/CheckProjectFiles.py
      - msbuild FrontierCommander.slnx /p:Configuration=Debug /p:Platform=x64 /m /warnaserror
      - vstest.console.exe x64\Debug\*Tests.dll /Platform:x64
    parallel_safe: true
    status: done
    notes: >
      Sim/Movement.h and .cpp walk the routes, Sim/Steering.h and .cpp keep devices apart, and
      stage 6 is planning then the walk then the separation, in that order.
      WHAT SLOPE COSTS was a hole in the design and not a number to look up: GameDesign.md 2 says
      slope costs movement and 6 says a drive "sets speed as a function of terrain", and the drive
      table has a speed factor, a max slope, a water flag and a hit-point factor and no terrain
      column at all. Put to the owner as OpenQuestions.md Q23 and answered 2026-09-18: full speed
      on the flat falling LINEARLY to half at the drive's OWN maximum, impassable beyond. Scaling
      to the drive's own limit is the point of the answer - tracks keep 75 percent of their speed
      on a 20 percent slope where wheels keep 60 - so the max slope column buys handling on ground
      both can cross and not only reach on ground one cannot. GameDesign.md 6 records it.
      MEASURED, and it is the number the design is sized by: a light on wheels with a machine gun
      crosses a flat Small landscape, 8,128 world units between the middles of the end cells, in
      1,563 ticks against the 1,563 its 1,331 subunits a tick allow. It cost two things to get
      there. The first is that a tick's distance is spent ACROSS legs: stopping short at a cell's
      middle and losing the remainder costs a twentieth of the speed on cell-sized legs, which is a
      crossing time that no longer matches what the design screen printed. The second is the row
      the test crosses on - a cluster's own first row, where the graph's doorways sit; half a
      cluster higher the same drive takes 1,804 ticks, all of it two diagonals to the doorway and
      back, which is S7's abstraction and is S7's suite to measure.
      SEPARATION IS AWAY-PLUS-A-QUARTER-TURN, not away. A purely radial push between two devices
      meeting head-on is exactly a brake, and they grind to a halt facing each other; turning the
      push a quarter turn - always the same way round - is antisymmetric in a second sense, so each
      takes the side the other does not and they pass. Measured: they close to 1,278 subunits and
      pass 357 subunits either side of the line they met on. The id tie-break is needed for exactly
      one case, two devices at the same point, where there is no direction to push along.
      Bucketed by cell rather than pair by pair: the radius is a quarter of a cell, and the
      eight-seat device cap is 2,400, which pair by pair is 2.9 million tests a tick.
      THE SNAPSHOT QUESTION S7 LEFT is answered the first way: the planning queue joins the
      snapshot, carrying each request and the route it has reached but never the search's working.
      A request still being searched is replayed for the nodes it had already spent, which
      Path::nodesExpanded already records, so a Frontier-sized open set never goes on the wire and
      the tick a route lands on is the tick it would have landed on. Version 12, with a device's
      patrol anchor, how far along its route it has walked and how long it has been stuck.
      TWO BUGS THIS TASK EXPOSED RATHER THAN CAUSED, both of which crash or silently break a
      reloaded match the moment a device moves. The snapshot never rebuilt the obstruction grid or
      the cluster graph, so a reloaded match's buildings were walked straight through - obstruction
      is derived from the standing structures and is in neither the landscape's definition nor its
      deltas, so Construction gained MarkStandingObstructions and the read calls it. And a Sim was
      not safely copyable at all: the cluster graph holds a pointer to the landscape and the
      planner a pointer to the graph, so the Sim that Snapshot::Read hands back planned against the
      landscape of the Sim it was moved out of. It segfaulted on the first tick after a reload.
      Sim's members are now a private base and its copy and move re-aim the two pointers; a
      hand-written member list would have put the next member added in the wrong place in silence.
      ALSO ADDED: Neuron::AngleOf, the inverse of Sin and Cos, found by bisecting the SAME table
      those two read rather than by a polynomial - a device turns to what it says and then drives
      along Sin and Cos of it, and an inverse that disagreed by a unit is a device that turns back
      and forth for ever. Measured round trip: exact, zero units, over the whole turn.
      NOT DONE, and it is S10's: a destroyed device must have its request cancelled. Nothing
      removes a device yet; PathPlanner::Cancel is what S10 calls when something does, and
      Sim/Movement.h says so where the next reader will look.

  - id: S9
    title: Sim visibility - fog grids with viewer counts, the budgeted refresh, height-extended sight, occlusion, the ghost store
    intent: >
      Fog of war is computed on the host and is also the replication filter (TechnicalDesign.md
      §4.6), so this is the system that makes the fog real and the one whose cost the design
      names first; it is built budgeted and deterministic from the start.
    project: Sim
    depends_on: [S1]
    files:
      - Sim/Visibility.h
      - Sim/Visibility.cpp
      - Sim/FogGrid.h
      - Sim/FogGrid.cpp
      - Sim/GhostStore.h
      - Sim/GhostStore.cpp
      - Sim/Seat.h
      - Sim/Snapshot.cpp
      - Sim/Sim.cpp
      - Sim/Sim.vcxproj
      - Sim/Sim.vcxproj.filters
      - Tests/SimTests/VisibilityTests.cpp
      - Tests/SimTests/SimTests.vcxproj
      - Tests/SimTests/SimTests.vcxproj.filters
    acceptance:
      - "FogGrid per seat holds a viewer count byte and a two-bit state per cell (unexplored, explored, visible); a cell is visible while its count is positive and explored forever after"
      - "A viewer's disc is its sight radius in cells plus one cell per 32 world units it stands above the target cell, each cell tested by an integer walk along the heightfield from the viewer, blocked by a sample above the line of sight; a moved viewer's old disc is un-counted before its new one is counted"
      - The refresh budget is 200 viewers per tick, moved viewers first, then the oldest refresh, so every viewer refreshes at least once per second; allied seats share vision by summing counts into a shared grid or by union at read, decided and tested
      - "GhostStore per seat records the last-seen state of every structure the seat has ever seen, updated when a structure leaves visibility and when it is seen again; the fog grid and the ghost store are in the snapshot, the grid run-length encoded"
      - "Tests: a ridge between viewer and target blocks; a hill extends the radius; the budget bounds the reads per tick; un-seeing on move; ghost recording and update; the reads per refresh are logged for the tick-cost measurement"
    verify:
      - python3 Tools/CheckTaskDag.py
      - python3 Build/CheckFormat.py --clang-format clang-format-18
      - python3 Build/CheckProjectFiles.py
      - msbuild FrontierCommander.slnx /p:Configuration=Debug /p:Platform=x64 /m /warnaserror
      - vstest.console.exe x64\Debug\*Tests.dll /Platform:x64
    parallel_safe: true
    status: done
    notes: >
      MEASURED, AND IT IS THE FINDING. A full refresh of 200 viewers at a 20-cell radius costs
      4,215,706 cell-height reads, 21,078 a viewer, and took 140 ms on the session's Linux harness
      - nearly three times the whole 50 ms tick. The cause was Visibility::CellHeight rescanning a
      cell's 25 samples on every query, so Landscape::Cell now carries highestSample, derived where
      the slope and the water bit are derived, and the same refresh takes 16.4 ms. That is still a
      third of the tick for one system and the figure to beat; the next easy win is the scan box,
      which is twice the sight radius on each side because height may extend the radius, and so
      scans 6,561 cells to light about 1,257 on ground where no viewer is raised at all. G3's
      measurement on the owner's hardware decides whether it is worth taking.
      THE VIEWER COUNT IS A uint16, NOT THE BYTE THE ACCEPTANCE ASKED FOR. Allied seats share one
      grid and an alliance may be all eight seats at 200 devices and 300 structures each, so 4,000
      viewers can hold one cell at a chokepoint. A byte saturating there could never be decremented
      back to zero and the cell would stay lit for the rest of the match - a fog that wrongly
      reveals is the worst failure this system has, and the second byte buys it away outright. The
      snapshot's run encoder is templated on the value type for it.
      ALLIED VISION IS SHARED BY WRITING, NOT BY UNION AT READ, which the acceptance left open. A
      viewer stamps its disc into every seat of its own alliance. Union at read was rejected
      because explored is history: a commander would otherwise not see ground their ally scouted an
      hour ago unless the history were unioned too, and unioning history on every read costs more
      than writing it once.
      STAMPS ARE NEW STATE and they are the heart of it. A cell is visible while its count is
      positive, so a viewer that moves must un-count exactly the disc it counted, and the only way
      to un-count exactly is to remember - the cell, and the radius, since a sight upgrade changes
      it. They are in the hash and in the snapshot at version 8.
      A HEIGHT DELTA DROPS THE WHOLE FOG. A stamped disc was worked out against the heights as they
      were; un-counting it against new ones takes viewers off cells that were never counted. So
      Sim::FlattenTerrain resets visibility and the budget refills it over the next ticks. The cost
      is that the explored history goes with it, which a test pins as a known consequence rather
      than a surprise; narrowing the reset to the cells the delta touches is work for S4, which is
      what will actually be calling it.
      Seat.h's fogViewers/fogState and its ghost vector became FogGrid and GhostStore, so the
      invariants - two arrays of one size, ghosts ascending by id - live with the data instead of
      with every caller. Seat.cpp is gone; SizeFog is FogGrid::Resize.

  - id: S10
    title: Sim combat - targeting, stances, hit rolls, projectiles and splash, the damage formula, destruction, experience, retreat
    intent: >
      The damage model of GameDesign.md §8 exists exactly as written, with direct fire decided at
      the shot and indirect fire at the impact, so that the matrix the balance script checks is
      the matrix the simulation applies.
    project: Sim
    depends_on: [S8, S9, S4]
    files:
      - Sim/Targeting.h
      - Sim/Targeting.cpp
      - Sim/Weapons.h
      - Sim/Weapons.cpp
      - Sim/Projectiles.cpp
      - Sim/Damage.h
      - Sim/Damage.cpp
      - Sim/Experience.h
      - Sim/Retreat.cpp
      - Sim/OrderValidation.cpp
      - Sim/Sim.cpp
      - Sim/Sim.vcxproj
      - Sim/Sim.vcxproj.filters
      - Tests/SimTests/DamageTests.cpp
      - Tests/SimTests/CombatTests.cpp
      - Tests/SimTests/SimTests.vcxproj
      - Tests/SimTests/SimTests.vcxproj.filters
    acceptance:
      - "A weapon acquires a target its seat can see within its long range by the stance and target-priority rules, fires at its rate, and rolls a hit from the simulation Random against the short or long hit chance plus rank and research percentages; direct fire resolves at the shot and emits a projectile event for the client; a Tower takes a target-priority stance only"
      - "Indirect fire (the mortar) needs a spotter with the target in its own sight, has a minimum range, launches a Projectile that lands at the predicted cell after its flight ticks and damages everything within its splash radius at impact, so a moving target walks out from under it"
      - "Damage is scaled = damage x modifier[weaponClass][targetClass] / 100 and dealt = max(scaled - armour x armorFactor[weaponClass] / 100, scaled / 3), against kinetic or thermal armour per weapon class, structures using their strength class; a device or structure at zero hit points is destroyed, a structure leaving a wreck, and the killer gains experience toward its eight ranks"
      - "Retreat: a device under its retreat threshold breaks off and returns to the nearest repair bay or repair device only if one is within 60 cells, else holds and fights; M1 has neither structure nor module, so the rule is tested with a stub repair point and the order kind ReturnToRepair is applied"
      - "Tests: the damage formula against hand-computed values (a cannon against tracks with 25 armour deals 47; the minimum third; the laser's half armour and artillery's zero via the table), the spotter rule, an indirect miss on a moving target, rank accrual, retreat only within 60 cells, two Sims fight identically"
    verify:
      - python3 Tools/CheckTaskDag.py
      - python3 Build/CheckFormat.py --clang-format clang-format-18
      - python3 Build/CheckProjectFiles.py
      - msbuild FrontierCommander.slnx /p:Configuration=Debug /p:Platform=x64 /m /warnaserror
      - vstest.console.exe x64\Debug\*Tests.dll /Platform:x64
    parallel_safe: true
    status: done
    notes: >
      Stages 8, 9 and 10 of the tick are no longer empty. Sim/Targeting acquires and fires,
      Sim/Weapons holds what a weapon is and flies the shells, Sim/Damage applies what the two
      decided, Sim/Retreat decides who leaves, and Sim/Experience says what a kill is worth.
      DAMAGE IS A QUEUE AND NOT A WRITE AT THE SHOT, which is the one structural decision here.
      Two shooters that both fire at one device in a tick both fired while it was alive, because
      both fired before either shot landed; a write at the shot makes the second shooter's tick
      depend on which of the two the walk reached first. Stages 8 and 9 queue, stage 10 applies,
      and the order of the walk stops mattering. The queue is scratch - filled and emptied inside
      one Advance - so it is neither hashed nor carried.
      ONE VISIBILITY TEST IS BOTH THE SIGHT RULE AND THE SPOTTER RULE. GameDesign.md 8 asks that a
      target be visible to someone on the commander's side, and that indirect fire "additionally"
      need a spotter. The fog grid of S9 is already the union of every viewer of the alliance, so
      the two are one subscript. What makes them bite differently is the tables: a cannon reaches
      16 cells on a chassis that sees 20, so a direct shooter always sees its own target; a mortar
      reaches 28 and sees 20, so it cannot fire at its longest range unless something else of its
      commander's is looking. The test that proves it is the one that takes the spotter away.
      THE OPTIMAL RANGE STANCE HAD TO BE DEFINED AND NOT JUST IMPLEMENTED, and the mortar is why.
      Optimal means "hold fire until the short band", and the mortar's short range IS its minimum
      range - both six cells - so the first rule written made it unable to fire at all. A weapon
      with no short band to close into opens at its long range under both stances: "engage at
      optimal range" cannot mean "engage inside the range you may not fire within". Caught by the
      spotter test, not by reading.
      THE TARGET PRIORITY IS THIS TASK'S AND IT IS NOW OpenQuestions.md Q24, OPEN. GameDesign.md 8
      says structures "take a target-priority stance only" and never says what the priorities are,
      and there is no such axis in the four the order set carries. The rule shipped is one for
      every shooter: keep the target you have while it is alive, visible and in range - a weapon
      that re-chose every tick would spray a crowd and kill nothing - and otherwise the nearest,
      devices before structures, ties to the lower id. Whether a commander may CHOOSE a priority
      is the open half, and it is an axis, an operand and a panel control, so it is m2-skirmish's.
      SPLASH HITS ENEMIES AND NOT THE SHOOTER'S OWN SIDE. The acceptance says an impact "damages
      everything within its splash radius", which reads as area-rather-than-target; GameDesign.md
      nowhere names friendly fire, and an area weapon is not where one arrives by implication. One
      condition in Sim/Weapons.cpp if the owner wants it the other way, and it is called out there.
      A SHELL CARRIES WHAT IT WAS FIRED WITH rather than looking it up when it lands: the chance
      and the damage are on the Projectile, so a shot fired by a device that dies in the two
      seconds it is in the air still lands as it was fired. Snapshot version 13, which also brings
      a structure's weapon reload - a field of its own and not a second use of the production
      countdown, which a mod that armed a factory would otherwise have the two share.
      MEASURED: two scouts four cells apart settle it on tick 156, against the ~160 the tables
      allow (100 hit points, 4 damage a hit through 5 armour, 80 percent every five ticks); eight
      scouts in a line fight down to four in 400 ticks, and two Sims agree on every one of them.
      SimTests is 134 methods and green; the snapshot of the three-seat fixture is 1,689 bytes.
      TWO INHERITED TESTS HAD TO CHANGE, both because a placeholder became real. SimTests asserted
      "stage 8 draws once a tick", which was the unconditional draw S1 put there to exercise the
      stream from M0; stage 8 now draws only when it has a hit to roll for, so the test asserts
      that instead and that Sim::Roll is the one door to the stream. And SnapshotTests' fixture
      gave its projectile nine ticks of flight and then ran fifty ticks, so stage 9 landed it and
      the hash test dereferenced a shell that was gone - the same class of fault as the furnishing
      S6 had to move after the ticks. It carries nine hundred now, and the fixture covers the two
      fields version 13 added.
      THE MORTAR TEST IS WHY S7's ABSTRACTION IS WORTH KNOWING ABOUT. The first version had the
      target run north half a cluster from a doorway, so its route detoured ten cells toward the
      mortar; a shell fired over fourteen cells leads its target by less than the splash and
      connects, and the test read as "the miss rule is broken" when the miss rule was fine. The run
      is along a cluster's own first column now, where the doorways are, and the test asserts the
      device really did run straight - so the day the route changes, it says so rather than
      quietly measuring something else.
      ALSO DONE HERE: the duty S8 wrote down for this task - a destroyed device's planner request
      is cancelled, so a job does not outlive its device and take budget from the ones still alive.
      Attack and ReturnToRepair now walk, which needed Sim/Movement.cpp: what makes them different
      from a Move is only who sets the destination, so the walk needs no case of its own.
      NOT DONE, and it is the content's rather than this task's: M1 ships neither a repair bay nor
      a repair module, so RepairPointNear always answers no on shipped content and every device
      holds and fights. The rule is written and tested against a fixture that defines both, which
      is what the acceptance asks for. The repairing itself, and the walk back to the guard
      position afterwards, belong to the task that ships the bay.

  - id: S11
    title: Sim victory and match flow - annihilation, the survival clock, surrender
    intent: >
      A match ends by the conditions of GameDesign.md §2 and the seats know it, so that the
      slice has an ending and the AI test has a termination.
    project: Sim
    depends_on: [S4, S5]
    files:
      - Sim/Victory.h
      - Sim/Victory.cpp
      - Sim/Seat.h
      - Sim/Sim.cpp
      - Sim/Sim.vcxproj
      - Sim/Sim.vcxproj.filters
      - Tests/SimTests/VictoryTests.cpp
      - Tests/SimTests/SimTests.vcxproj
      - Tests/SimTests/SimTests.vcxproj.filters
    acceptance:
      - Annihilation eliminates a seat when it has no structure and no device carrying a builder module; the last side with an uneliminated seat wins; Survival ends at the clock with the side that extracted the most power winning; Surrender eliminates the seat
      - Victory state per seat is Playing, Won, Lost or Eliminated, checked at stage 12, and the match stops advancing once decided
      - "Tests: annihilation with a surviving builder, the last-side rule with two allied seats, survival at the clock, surrender"
    verify:
      - python3 Tools/CheckTaskDag.py
      - python3 Build/CheckFormat.py --clang-format clang-format-18
      - python3 Build/CheckProjectFiles.py
      - msbuild FrontierCommander.slnx /p:Configuration=Debug /p:Platform=x64 /m /warnaserror
      - vstest.console.exe x64\Debug\*Tests.dll /Platform:x64
    parallel_safe: true
    status: done
    notes: >
      Stage 12 is Sim/Victory.{h,cpp}. GameDesign.md §2 gives each condition a sentence and stage 12
      needs a rule, so §2 now carries the six readings this task had to take; the two that were
      real decisions rather than restatements are these.

      SURVIVAL IS DECIDED ON WHAT WAS EXTRACTED, NOT ON WHAT IS HELD. "The side that extracted the
      most power wins" cannot be answered by the stockpile: a commander who spent what he dug would
      lose to one who sat on it, and the stockpile cap throws income away, so two economies that
      differ by a factor of three can end the clock at the same number. Seat::extractedHundredths is
      a running total that stage 2 adds the served extractors' output to before the cap and before
      the command post's trickle - the command post generates, it does not extract. 64 bits, because
      it only ever grows.

      A SEAT THAT NEVER HELD A BASE CANNOT BE ANNIHILATED. The rule as the design states it -
      neither a structure nor a builder - is true of a seat the lobby has just created, so without a
      latch a match would end before its base level was placed, and so would every suite that
      advances a tick over a world it has not filled. Seat::everHeldBase is that latch, set by the
      same walk that tests the rule. It is also what keeps a combat test of two scouts from ending
      as a double annihilation: neither seat ever held a structure or a builder, so neither is out.

      WHAT WENT IN THE OTHER DIRECTION. Seat::defeated is gone rather than joined: the victory state
      is the same fact spelled better, and Seat.h's own header warns against a second field that can
      disagree with the first. Seat::Defeated() is the question spelled out, and it means Eliminated
      - out during play - which is not Lost, which is being on the board at the end and not winning.
      A decided match no longer advances at all: Sim::Advance returns at once, so the tick, the
      stream, the world and the hash stay as the deciding tick left them.

      Dominance still falls through to the annihilation rule. It needs 60% of a landscape's deposits
      held for ten continuous minutes and ships with the first Large landscapes (GameDesign.md §2),
      so a match set to it is played rather than refused.

      Snapshot version 14 and ADR-003's table with it: a seat is 157 bytes and the three-seat
      fixture 1,716. Measured: SimTests 143 passed, 0 failed; VictoryTests is 9 of them.

  - id: S12
    title: Sim scripted AI seat
    intent: >
      The scripted opponent of the slice is the planner of TechnicalDesign.md §7 with one
      hard-coded behaviour list, so that it is the M2 AI's skeleton rather than a throwaway, and
      an AI-versus-AI match from a seed is the test that exercises every system at once.
    project: Sim
    depends_on: [S6, S10, S11]
    files:
      - Sim/AiSeat.h
      - Sim/AiSeat.cpp
      - Sim/AiBlackboard.h
      - Sim/AiBlackboard.cpp
      - Sim/AiDesigner.h
      - Sim/AiDesigner.cpp
      - Sim/Sim.cpp
      - Sim/Sim.vcxproj
      - Sim/Sim.vcxproj.filters
      - Tests/SimTests/AiTests.cpp
      - Tests/SimTests/SimTests.vcxproj
      - Tests/SimTests/SimTests.vcxproj.filters
    acceptance:
      - "The AI seat observes through its own fog grid and ghost store into a blackboard: known enemy structures, a threat map at cluster resolution, its economy and army composition; it runs at stage 11 within a budget and emits orders for tick t plus its delay through the ordinary queue"
      - "The behaviour list is fixed for M1: claim the nearest deposits with extractors and a generator within 48 cells, build a factory and a lab, research by auto-research, design by AiDesigner (expected damage per power against the seen enemy composition through the damage matrix, best design per role), produce to a composition, attack-move with a group when its strength exceeds a threshold, rebuild what is lost"
      - No wall time, no float, no thread; the AI's decisions are a function of the state and the tick
      - "Tests: AI against AI on GameData/Landscapes/Slice.json from a fixed seed reproduces hash for hash in two Sims; within 12,000 ticks both seats have a served extractor, a factory and a lab and have fielded a device, and first contact has occurred; a 36,000-tick run reaches a decided victory state, run in a test that CI can afford (its duration is recorded in the notes)"
    verify:
      - python3 Tools/CheckTaskDag.py
      - python3 Build/CheckFormat.py --clang-format clang-format-18
      - python3 Build/CheckProjectFiles.py
      - msbuild FrontierCommander.slnx /p:Configuration=Debug /p:Platform=x64 /m /warnaserror
      - vstest.console.exe x64\Debug\*Tests.dll /Platform:x64
    parallel_safe: true
    status: done
    notes: >
      Sim/AiBlackboard observes, Sim/AiDesigner scores and Sim/AiSeat decides, at stage 11. The
      blackboard is entirely DERIVED and rebuilt every decision, so the AI adds nothing to the state
      hash and nothing to the snapshot - a blackboard that were state would be a second copy of the
      world two hosts could disagree about. No wall time, no float, no thread; two Sims from one
      seed agree hash for hash over 3,000 ticks of a real match, which is the test that would catch
      any of the three.

      THREE ORDERINGS IN THE BEHAVIOUR LIST COST A RUN EACH TO FIND, and they are the substance of
      this task rather than the code around them. (1) A GENERATOR GOES UP BEFORE THE SECOND
      EXTRACTOR: GameDesign.md §4 says an extractor earns nothing until a generator reaches it, and
      the first version claimed four deposits first - four extractors' worth of power spent on an
      income of nothing, and a match where neither commander ever extracted a single unit. (2)
      NOTHING NEW IS PLACED while there are more unfinished sites than builders to work them, with a
      slack of one: without the rule one truck is spread over six plans and finishes none, and
      without the slack a site no builder can reach - a deposit on a summit - stops the commander
      building anything else for the rest of the match. (3) THE ATTACK BEHAVIOUR IS EVALUATED EVERY
      DECISION rather than taking its turn: idle fighters are not a resource the base is competing
      for, and behind the queue it never ran at all, because a factory with something to produce
      answers first every decision for the whole match.

      TWO THINGS THE SIMULATION MADE THE AI LEARN. A deposit it has never SEEN cannot be built on -
      CheckPlacement refuses an unexplored footprint - so a builder walks to it first, which is a
      scouting behaviour the acceptance did not ask for and the placement rule requires. And a group
      is sent FOUR CELLS SHORT of what it attacks: the cell a commander starts on is where his
      command post stands, a structure's cells are impassable, and a route into the middle of a base
      comes back unreachable, so an army ordered at one stands where it was built. A group and not
      the whole army, too: the planner's budget is 2,000 nodes a tick shared across every request,
      so thirty cross-map searches at once each get seventy nodes and none of them finishes.

      NOTHING IN THE TREE OWNS BASE-LEVEL PLACEMENT YET. GameDesign.md §2's "nothing but a builder
      and a command post" is placed by the TEST here, because m1-vertical-slice/G1 is the task that
      starts a match. The test also has to put the builder on ground its drive can stand on: a
      device dropped on a cliff has no component in the cluster graph, every route it is given comes
      back unreachable, and it stands there for the whole match - which looked like an AI fault for
      three runs and was a placement one.

      MEASURED, on GameData/Landscapes/Slice.json from seed 20260919 with the real GameData tables:
      first contact on tick 6,003; at 12,000 ticks both commanders hold a served extractor, a
      generator, a factory, a lab and devices they built themselves, and both have completed
      research. The 36,000-tick run reaches a decided victory state with 20,318 and 40,533 power
      extracted. DURATION, as the acceptance asks: 14 s for the 12,000-tick run and 54 s for the
      36,000-tick one, on the Linux harness at -O0; CI's MSVC Debug build is the number to watch,
      and the suite's step was 2m45s before this task.

      The behaviour list and the blackboard's fields are documented in the header comment of
      AiSeat.h, not in a prose file: project directories are flat (AGENTS.md §2).

      Measured: SimTests 148 passed, 0 failed, of which AiTests is 5.

  - id: N1
    title: Net wire records and encodings
    intent: >
      The wire form of every replicated thing (TechnicalDesign.md §5.3) exists as fixed-width
      integer aggregates with pinned byte layouts, including the fog delta the client needs to
      draw its own commander's fog, so that host and replica share records and nothing else.
    project: Net
    depends_on: [S1]
    blocked_by:
      - m0-foundation/T10
      - m0-foundation/T14
    files:
      - Net/Records.h
      - Net/Records.cpp
      - Net/Messages.h
      - Net/Messages.cpp
      - Net/Net.vcxproj
      - Net/Net.vcxproj.filters
      - Tests/NetTests/RecordsTests.cpp
      - Tests/NetTests/NetTests.vcxproj
      - Tests/NetTests/NetTests.vcxproj.filters
    acceptance:
      - "DeviceState, StructureState, WreckState, FeatureState, SeatState, Event, DesignState, FogDelta (runs of cells with their new fog state, for the commander's own grid) and OrderMessage are plain aggregates of fixed-width integers; a position on the wire is quantised to a quarter of a world unit and, in a change record, sent as a delta against the baseline under a field mask; a device change record is at most 14 bytes plus its mask by static_assert"
      - "Messages: Join, JoinAccepted (seat, settings, landscape definition, tick), JoinRefused (reason), Frame (sequence, baseline sequence, created, changed, removed, events, fog deltas), Fragment (frame sequence, index, count, bytes), Ack, Orders (sequenced), Heartbeat"
      - Every record writes and reads through Core's byte stream, and NetTests pins the exact bytes of one instance of each so a layout change is a visible diff, plus round trips and truncation cases
    verify:
      - python3 Tools/CheckTaskDag.py
      - python3 Build/CheckFormat.py --clang-format clang-format-18
      - python3 Build/CheckProjectFiles.py
      - msbuild FrontierCommander.slnx /p:Configuration=Debug /p:Platform=x64 /m /warnaserror
      - vstest.console.exe x64\Debug\*Tests.dll /Platform:x64
    parallel_safe: true
    status: done
    notes: >
      Net/Records.h is the wire form of a device, a structure, a wreck, a feature, a seat, a design,
      an event and a run of fog, and Net/Messages.h the eight datagrams they travel in. Positions
      quantise to a quarter of a world unit by FLOOR division, so that the step is uniform across
      zero rather than double-width at it, and come back as the middle of the quarter they named, so
      the round trip errs by half a step either way instead of a whole step downwards.

      A DEVICE'S ORDER AND ITS FOUR STANCES ARE ONE BYTE, and that is what makes TechnicalDesign.md
      §5.7's fourteen-byte changed record fit: seven orders times three fire, two range, three
      retreat and two movement stances is 252 of the 256 values a byte has, where the same five as
      bit fields need nine bits and would cost a second byte on every device that turned round. The
      four unused values are refused on read. Fourteen is then exactly the id, the six-byte position
      delta, the heading, the hit points and that byte, which a static_assert pins. The fields NOT
      in the mask - design, seat, rank and target - are the ones that rarely change, and a device
      whose rank or target changed is re-sent whole rather than widening every frame's worst case.

      A NAME COLLISION THAT HAD TO BE SETTLED. TechnicalDesign.md §5.3 names the wire record
      StructureState and Sim already had an enumeration of that name; one namespace cannot hold
      both. The simulation's is now StructurePhase, which is the better name for what it is, and the
      wire keeps the name the design gives it. A mechanical rename over 22 files, no behaviour
      changed, SimTests unchanged at 143 passing.

      THE WIRE DOES NOT SHARE THE SNAPSHOT'S WRITER, deliberately. Net writes the settings and the
      landscape definition itself: they are two streams with two versions, so a snapshot that gained
      a field would otherwise break every client of a host that can save, and they carry different
      payloads - a snapshot carries the flatten deltas and the wire must not, because the terrain
      under an unscouted base is not public (§5.2).

      Measured: NetTests 14 passed, 0 failed. Every record's bytes are pinned by hand from the
      layout rather than recorded from a run, every record round-trips, and every prefix shorter
      than a whole record is refused - 211 truncation cases across the nine.

