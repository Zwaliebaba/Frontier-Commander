    title: Content loaders, validation with file-and-line diagnostics, and FrontierHost --validate; the content ADR
    intent: >
      Game data is JSON files under Content\ (TechnicalDesign.md §8) read into plain row
      aggregates by one loader that refuses a broken tree with a location, and the same code
      runs in CI as FrontierHost --validate, so that a table edit that would break the game
      breaks the build first.
    project: Content
    depends_on: []
    blocked_by:
      - m0-foundation/T11
      - m0-foundation/T13
      - m0-foundation/T17
    files:
      - Content/ComponentDesc.h
      - Content/ResearchItemDesc.h
      - Content/StructureDesc.h
      - Content/DamageTable.h
      - Content/BiomeDesc.h
      - Content/LandscapeDefinition.h
      - Content/StampDesc.h
      - Content/ModelDesc.h
      - Content/SoundEventDesc.h
      - Content/ContentTree.h
      - Content/ContentLoader.h
      - Content/ContentLoader.cpp
      - Content/ContentValidator.h
      - Content/ContentValidator.cpp
