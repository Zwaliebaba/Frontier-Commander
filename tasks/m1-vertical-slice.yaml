      THE LATCH IS ON ClientView AND NOT BESIDE THE SIMULATION'S SEAT. A refusal is reported to the
      commander who sent the order: a seat playing under AI has nobody to tell, and a client that
      joins has no business being handed a refusal from before it arrived. Both fall out of the
      latch starting empty with the view rather than needing a rule.
