  - id: K1
    title: Client geometry pass - model buffers, instancing, team colour unlit, per-face normals
    intent: >
      Devices, structures, features, wrecks and shells are drawn from the render view in the
      Species look (GameDesign.md §11 point 1; TechnicalDesign.md §6.4), with the team-colour
      slot written unlit as pillar 3 demands, so that a fight reads from the far end of the map.
    project: Client
    depends_on: [C1]
    blocked_by:
      - m0-foundation/T20
    files:
      - Client/ModelBuffers.h
      - Client/ModelBuffers.cpp
      - Client/GeometryPass.h
      - Client/GeometryPass.cpp
      - Client/Shaders/GeometryVS.hlsl
      - Client/Shaders/GeometryPS.hlsl
