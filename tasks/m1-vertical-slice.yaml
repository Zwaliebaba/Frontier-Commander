      this task's acceptance both say 30. The table was wrong, not the design.
      Module effects: the generator's +2 was already live (S3 reads it where it serves), and the
      factory's and the lab's have no consumer until S5 and S6 - ModuleTimeReductionPercent is here
      so that when they arrive they read it from one place rather than two.

