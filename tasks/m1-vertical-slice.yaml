  - id: S3
    title: Sim economy - deposits, extractors served within 48 cells, the stockpile and its cap, cost and refund, the army caps
    intent: >
      Power comes from the ground through the chain GameDesign.md §4 describes, with the brakes
      the review added, so that a turtled base cannot bank an army and generators are the
      target at this game's distances.
    project: Sim
    depends_on: [S2, C2, C5]
    files:
      - Sim/Economy.h
      - Sim/Economy.cpp
      - Sim/Deposit.h
      - Sim/Deposit.cpp
      - Sim/MatchSettings.h
      - Sim/OrderValidation.h
      - Sim/OrderValidation.cpp
      - Sim/Sim.h
      - Sim/Sim.cpp
      - Sim/Snapshot.h
      - Sim/Snapshot.cpp
      - Sim/Sim.vcxproj
      - Sim/Sim.vcxproj.filters
      - FrontierCommander/App.cpp
      - Tests/SimTests/EconomyTests.cpp
      - Tests/SimTests/SimTests.vcxproj
      - Tests/SimTests/SimTests.vcxproj.filters
    acceptance:
      - Deposits come from the landscape definition and are simulation objects an extractor is built on and nowhere else
      - "A generator serves the four nearest unserved extractors within 48 cells, recomputed when a generator or extractor is completed or destroyed, ties broken by ascending id; an extractor beyond every generator's reach produces nothing; a served extractor yields 5 power per second and a command post 1, credited per tick in hundredths"
      - The stockpile is capped at 1,000 plus 500 per completed generator; cost is drawn when construction or production begins; cancelling refunds the unbuilt share and any refund above the cap is lost; cancelled research refunds nothing; demolition refunds half
      - "The device cap (100, 200 or 300 from MatchSettings) and the structure cap of 300 are enforced: a factory at the cap pauses, a placement at the cap is rejected AtCap"
      - "Tests reproduce the worked numbers: income over 20 ticks, the fifth extractor unserved, a generator at 49 cells serving nothing, the cap at two generators, a refund clipped by the cap, the factory pause"
    verify:
      - python3 Tools/CheckTaskDag.py
      - python3 Build/CheckFormat.py --clang-format clang-format-18
      - python3 Build/CheckProjectFiles.py
      - msbuild FrontierCommander.slnx /p:Configuration=Debug /p:Platform=x64 /m /warnaserror
      - vstest.console.exe x64\Debug\*Tests.dll /Platform:x64
    parallel_safe: true
    status: done
    notes: >
      The device cap had nowhere to come from: GameDesign.md 4 calls it a lobby setting and
      MatchSettings had no field for it, so DeviceCapLevel and DEVICE_CAPS are added beside
      PowerLevel and the snapshot is at version 7. The structure cap is STRUCTURE_CAP, one number
      for every match, because the design gives one.
      A deposit is NOT an object in World. Nothing ever refers to one - an extractor knows the cell
      it stands on and that is the whole relationship - so an id would buy a sixth ObjectKind and a
      sixth map for a record that never changes and is never pointed at. Sim/Deposit.h is the index
      instead, rebuilt from the definition wherever a definition arrives, which is CreateLandscape
      and Snapshot::Read; a test pins that a restored match still has its deposits and goes on
      earning, because forgetting the second of those two would have been silent.
      The service assignment is recomputed every tick rather than on completion and destruction as
      the acceptance says. It satisfies the acceptance strictly (the answer is right after any such
      event) and removes the class of bug where a system that changes a structure forgets to mark
      the cache; the cost is bounded by the structure cap at around 20,000 squared-distance tests a
      seat a tick, and a stale assignment two hosts agree on is a wrong economy rather than a
      desync, which is the harder of the two to find. Caching wants a profile that asks for it.
      The counts on the Seat are filled by one walk of the world in stage 2 rather than by running
      totals. Seat.h says they are kept rather than counted "because the cap is tested on every
      production tick"; the field stays and the test stays a subscript, but nothing has to remember
      to decrement.
      GameDesign.md 4's cap collides with its own lobby: PowerLevel::High starts a commander at
      2,500 against a base cap of 1,000. The cap is on what ACCUMULATES - the section's own words
      are "income accumulates into a stockpile capped at" and "any refund that would exceed the cap
      is lost" - so a stockpile already over its cap is left alone and simply stops growing. The
      alternative, clipping the balance, deletes three fifths of a lobby setting on the first tick.
      Raised for the owner rather than settled here.
      S2 left two checks deliberately loose for this task and both are exact now: a placement is
      priced by its row's costHundredths rather than by "the stockpile is empty", and an extractor
      is refused anywhere but a deposit. OrderContext gained the content tree and the deposit field
      for them, both optional, so a suite that cares about ownership still needs neither.

