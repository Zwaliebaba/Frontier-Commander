# Schema: Design/ImplementationPlan.md §3    Validate: python3 Tools/CheckTaskDag.py tasks/m1-vertical-slice.yaml
#
# Commands under `verify` that name msbuild, vstest or RunClangTidy are what CI runs on the pull
# request; an agent session runs on Linux and reads their result off the PR (ImplementationPlan.md §2).

plan: m1-vertical-slice
title: M1 Vertical slice - two commanders on a Small landscape build, design, research and fight to annihilation over loopback
phase: 1
summary: >
  What M1 proves (GameDesign.md §12): two commanders, one human and one scripted, on a Small
  landscape build extractors, generators, a factory and a lab, design a device and fight to
  annihilation, with a host thread and the loopback transport in one process and the client a
  replica from the first slice (owner, 2026-09-17). Content is one landscape, five structures
  and one defence, three chassis, three drives, four modules, thirty research items, a
  fixed-panel interface per Design/Interface.md, Net and Replica over loopback, one scripted AI,
  the damage and visibility models complete, and the M1 tables checked by the cost-efficiency
  script.

  Task ids carry a letter for the layer so that a reader can see the shape: D design, C content,
  S simulation, N net, R replica, K client (engine), G game executable. Every task is blocked by
  the M0 task that gives it its library; the checker shows those as "held by another plan" until
  M0 lands.

  What this plan deliberately leaves to M2, so that nobody adds it here: audio, the sprite
  pass and particles, water with waves, the sky and clouds, Eclipse-shaped windows (M1 has fixed
  panels), save and resume, a lobby, hover, walls and hardpoints, and every module not in the
  four. Projectiles are small geometry instances and an explosion is a sound-less wreck.

  Placeholders: the owner makes the models (owner, 2026-09-17), and until they exist every
  model is a generated primitive with markers, so that composition at markers is exercised
  rather than faked. The Species palettes, icons and the Spectrum font come across under
  the provenance ADR.

tasks:
  - id: D1
    title: Write Design/Interface.md - the M1 fixed-panel interface
    intent: >
      The slice cannot run without a specification of what the operator sees and clicks
      (Design/README.md), and the interface is the one design document the drafts did not
      write. It is written as fixed panels, the M2 Eclipse windows being a later restyling of
      the same content.
    project: Design
    depends_on: []
    files:
      - Design/Interface.md
      - Design/README.md
    acceptance:
      - "Specifies, with a layout sketch in text at the authored resolution: the selection panel (what is selected, its parts, health, rank, orders and stances), the production panel (factory queue from the seat's designs), the design panel (chassis, drive, modules with the derived statistics shown before commit, needing a command post), the research panel (available items with cost, time and effect; auto-research toggle), the construction panel (structure choice and placement with a footprint ghost and the slope and water rules shown), the minimap (fog states, structures, selection, camera frustum, click to move the camera), the power readout (stockpile, cap, income), the order hotkeys and mouse bindings, the end-of-match overlay, and Escape's pause menu"
      - Every panel names the Replica data it reads (R2) and the orders it emits (S2), so K4 and G1 have nothing to invent
      - Design/README.md's table lists it as Design, and the owner's merge of the PR is its acceptance; the PR says so
    verify:
      - python3 Tools/CheckTaskDag.py
    parallel_safe: true
    status: done
    notes: >
      Design/Interface.md, written 2026-09-17. Its §11 lists eleven things no document supplied,
      each against the task that owns it, four of which block K4: the inverse of FitAuthored, what
      Core/RenderView.h must grow for R2, a wire record for the order rejections S2 already
      computes, and the chrome palette file. Its §12 lists nine rulings, three against a reference
      document: text at 16 pixels in one face rather than Species's 12 and 13, one-pixel borders,
      and the right button giving orders while the middle button aims the camera, which M0 had
      bound the other way and G1 changes. The owner's merge of the pull request is the acceptance
      of all nine.

  - id: C1
    title: Content loaders, validation with file-and-line diagnostics, and FrontierHost --validate; the content ADR
