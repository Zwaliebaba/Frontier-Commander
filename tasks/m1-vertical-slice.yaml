      - Content/DesignStats.cpp
      - Content/Content.vcxproj
      - Content/Content.vcxproj.filters
      - FrontierHost/Main.cpp
      - Tests/ContentTests/ContentLoaderTests.cpp
      - Tests/ContentTests/ContentValidatorTests.cpp
      - Tests/ContentTests/DesignStatsTests.cpp
      - Tests/ContentTests/BrokenFixtures.h
      - Tests/ContentTests/ContentTests.vcxproj
      - Tests/ContentTests/ContentTests.vcxproj.filters
      - Design/ADR/README.md
      - Design/TechnicalDesign.md
    acceptance:
      - "One row aggregate per table with plain camelCase fields (R8), every number an integer in the unit its name says (hundredths for factors and percentages, ticks for times, subunits for distances, power in hundredths): ChassisDesc, DriveDesc, ModuleDesc, ResearchItemDesc, StructureDesc and its module rows, DamageTable (five weapon classes by ten target classes plus armorFactor and the armour kind per weapon class), BiomeDesc (palette, water and wave bitmaps, the two lights, fog, sky), LandscapeDefinition (the schema m0-foundation/T16 wrote), StampDesc, ModelDesc (positions, colours, triangles, markers, fragments), SoundEventDesc"
      - 'ContentLoader reads GameData\ from Paths::GameDataDirectory() or a directory given to it, file by file, into a ContentTree, and stops at the first file that fails with the file, line and column; ContentValidator then checks the whole tree: every research prerequisite exists and the tree has no cycle, every unlock names a real component or structure, every model, texture and sound a row names exists, no id is duplicated, every number is within the range its field declares, and every landscape''s palette names a biome'
      - "DesignStats derives speed, hit points, armour, cost, build time and sight from a chassis, a drive and modules by the formulas of GameDesign.md §6, in integer arithmetic, and ContentTests reproduces the two worked examples (104 world units per second, 130 power, 13 seconds; 29, 490, 49) once C2's tables exist, against literal rows until then"
      - FrontierHost --validate [directory] loads and validates with that code and exits 0 or non-zero printing every diagnostic; it is a step in CI guarded on Content\\Components.json existing, added to the workflow in this task
      - 'ContentTests loads a tree written to a temporary directory by the test, never GameData\ in place, and refuses each of a set of deliberately broken documents with the right file and line: a missing prerequisite, a cycle, an unknown model, a duplicate id, a number out of range, a malformed file'
      - The content ADR, numbered when written, records the directory layout, every schema with a version field, the range of every numeric field, and the rule that a loader change and a content change ship together
    verify:
