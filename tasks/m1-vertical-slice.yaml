      THE FIELDS ARE FIXED-SIZE AND THERE ARE THREE. Design/Interface.md 6 draws one line and
      replaces it, so a list would be compared and sent every frame for a display that shows one at
      a time. The third field is the sequence, and it is the one that earns its place: two identical
      refusals are equal field for field, so without it the line would not restart and a commander
      asking twice for what he cannot afford would read it as not having been heard. It counts
      refusals rather than naming a tick, so the client compares it for inequality and never for
      order, and it steps over 0 when it wraps because 0 is how a seat that has had none says so.
      THE READER REFUSES A REASON THAT DISAGREES WITH ITS SEQUENCE, both ways round: Accepted with
