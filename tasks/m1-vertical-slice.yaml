    title: Write Design/Interface.md - the M1 fixed-panel interface
    intent: >
      The slice cannot run without a specification of what the operator sees and clicks
      (Design/README.md), and the interface is the one design document the drafts did not
      write. It is written as fixed panels, the M2 Eclipse windows being a later restyling of
      the same content.
    project: Design
    depends_on: []
    files:
      - Design/Interface.md
      - Design/README.md
    acceptance:
      - "Specifies, with a layout sketch in text at the authored resolution: the selection panel (what is selected, its parts, health, rank, orders and stances), the production panel (factory queue from the seat's designs), the design panel (chassis, drive, modules with the derived statistics shown before commit, needing a command post), the research panel (available items with cost, time and effect; auto-research toggle), the construction panel (structure choice and placement with a footprint ghost and the slope and water rules shown), the minimap (fog states, structures, selection, camera frustum, click to move the camera), the power readout (stockpile, cap, income), the order hotkeys and mouse bindings, the end-of-match overlay, and Escape's pause menu"
      - Every panel names the Replica data it reads (R2) and the orders it emits (S2), so K4 and G1 have nothing to invent
      - Design/README.md's table lists it as Design, and the owner's merge of the PR is its acceptance; the PR says so
    verify:
      - python3 Tools/CheckTaskDag.py
    parallel_safe: true
    status: done
    notes: >
      Design/Interface.md, written 2026-09-17. Its §11 lists eleven things no document supplied,
      each against the task that owns it, four of which block K4: the inverse of FitAuthored, what
      Core/RenderView.h must grow for R2, a wire record for the order rejections S2 already
      computes, and the chrome palette file. Its §12 lists nine rulings, three against a reference
      document: text at 16 pixels in one face rather than Species's 12 and 13, one-pixel borders,
      and the right button giving orders while the middle button aims the camera, which M0 had
      bound the other way and G1 changes. The owner's merge of the pull request is the acceptance
      of all nine.

