      - Design/ADR/README.md
      - Design/TechnicalDesign.md
    acceptance:
      - ModelBuffers loads a ModelDesc into vertex and index buffers with one colour per vertex and a team-colour flag per vertex where the model's slot colour was; the per-face normal comes from screen-space derivatives in the pixel shader or from split vertices, and the ADR this task writes decides which with a captured frame of a placeholder model
      - GeometryPass draws every instance of the render view with one instance buffer per model per frame, the seat colour substituted for flagged vertices and those vertices written unlit, lit otherwise by the two directional lights of the terrain pass
      - The unit test covers the loader's vertex splitting or flagging on a small model; the capture job's frames show composed placeholder devices once G2 lands
    verify:
      - python3 Tools/CheckTaskDag.py
      - python3 Build/CheckFormat.py --clang-format clang-format-18
      - python3 Build/CheckProjectFiles.py
      - msbuild FrontierCommander.slnx /p:Configuration=Debug /p:Platform=x64 /m /warnaserror
      - vstest.console.exe x64\Debug\*Tests.dll /Platform:x64
    parallel_safe: true
    status: done
    notes: >
      ADR-011 is the decision TechnicalDesign.md 6.4 deferred: the loader splits and bakes, it does
      not take the normal from the pixel shader's derivatives. The argument that settled it is not
      the cost - it is that the terrain's way of fixing the derivative's sign, "if the normal points
      down, flip it", is the ground knowing it faces up, and a model has no such rule. The cost is
      arithmetic either way: over the twenty-two models in GameData\Models the colour alone, which a
      derivative renderer still has to split on because a flat attribute comes from the triangle's
      first vertex, costs 232 vertices against the descriptions' 176; keying the normal in as well
      costs 528, which is 14.8 kB for the whole set. Measured through LoadContent and BuildModelMesh
      rather than estimated. The outward normal turned out to be cross(c - a, b - a) and not the
      textbook cross(b - a, c - a): the placeholder generator winds a front face clockwise seen from
      outside, which is what Direct3D calls front by default, and all 264 triangles agree; getting it
      backwards lights every model from inside and the symptom says nothing, so a test pins all six
      faces of a box and ModelMesh::inwardFacingTriangles counts the disagreements for authored
      models later. What this task does NOT have is the captured frame its acceptance asks for -
      G2 composes devices into the capture and R2 fills the render view, so no frame with a model in
      it exists yet. ADR-011 says so in its own measurements section and names what would overturn
      it. The pass is written and registered but nothing calls it: App.cpp is G2's file, not this
      one's. The acceptance's "one instance buffer per model per frame" is implemented as one buffer
      per frame holding a contiguous run per model, one draw per run - the same batching with one
      allocation instead of a resource per model per frame.
      CI run 76 was red on a link error this task caused and the session's Linux harness cannot see:
      ModelBuffers.obj is the first Client object a ClientTests test names that touches Direct3D, and
      a named symbol drags its whole object in, so the suite suddenly needed the libraries the
      executable links and linked none of them - unresolved WINRT_IMPL_RoOriginateLanguageException,
      which is winrt::check_hresult's originate. ClientTests.vcxproj now carries the same
      d3d12.lib;dxgi.lib;runtimeobject.lib FrontierCommander does. K2 would have hit it again for
      D3D12SerializeRootSignature.

  - id: K2
    title: Client fog pass
    intent: >
      Unexplored cells are black and explored ones dimmed from the commander's fog grid as the
      replica knows it (TechnicalDesign.md §6.2), so that what the player sees is what the host
      sent and nothing more.
    project: Client
    depends_on: []
    blocked_by:
      - m0-foundation/T20
    files:
      - Client/FogPass.h
      - Client/FogPass.cpp
      - Client/Shaders/FogVS.hlsl
      - Client/Shaders/FogPS.hlsl
      - Client/SceneTarget.h
      - Client/SceneTarget.cpp
      - Client/Client.vcxproj
      - Client/Client.vcxproj.filters
      - Core/RenderView.h
      - Tests/ClientTests/FogPassTests.cpp
      - Tests/ClientTests/ClientTests.vcxproj
      - Tests/ClientTests/ClientTests.vcxproj.filters
      - Design/TechnicalDesign.md
    acceptance:
      - A per-cell fog texture is updated from the render view's fog grid only for rows that changed, and a full-screen pass darkens explored cells and blacks unexplored ones after the geometry pass and before the UI
      - The capture job's frames show the three states once G2 lands
    verify:
      - python3 Tools/CheckTaskDag.py
      - python3 Build/CheckFormat.py --clang-format clang-format-18
      - python3 Build/CheckProjectFiles.py
      - msbuild FrontierCommander.slnx /p:Configuration=Debug /p:Platform=x64 /m /warnaserror
      - vstest.console.exe x64\Debug\*Tests.dll /Platform:x64
    parallel_safe: true
    status: done
    notes: >
      THE RENDER VIEW HAD NO FOG GRID TO READ. The acceptance says "from the render view's fog grid"
      and Core/RenderView.h carried instances and changed chunks and nothing else, so this task added
      FogShade and FogView to it; R2 fills them, and Interface.md 7 already promised the minimap the
      same grid. The changed rows are part of the view rather than something the client diffs out:
      every device that moves changes fog, so "did anything change" is true every frame and only
      "which rows" is worth having, and the producer knows it for free. Same bargain as changedChunks.
      HOW A PIXEL FINDS ITS CELL. The pass reads the depth buffer and runs it back through the
      inverse view projection, because what the fog darkens is whatever was DRAWN at a pixel - ground,
      device, structure - and the depth buffer is where that already is. The darkening is the blend
      state, source ZERO and destination SRC_COLOR, so the colour target is never read as a texture
      while it is a render target, which is not legal. A depth of zero is the reversed depth's far
      value and means nothing was drawn, so the background keeps the clear colour instead of going
      black. SceneTarget gained Bind, BindColorOnly and Depth(), because the depth buffer cannot be a
      texture and a bound depth target at once; its own contract already said whoever moves a target's
      state moves it back. Two depth views are declared and one is null - a Texture2DMS view of a
      one-sample resource is not legal and neither is the reverse, and the scene target falls back to
      one sample on an adapter without multisampling. The pass runs once per pixel and takes sample
      0's depth, so a silhouette crossing a cell boundary gets one answer for four samples: one pixel
      along one line, against four times the work to fix it. The shade for explored is 0.5, which is
      Interface.md 7's "half brightness" rather than a number picked here. The grid is fetched by
      integer coordinate with no sampler, because interpolating between two fog states would invent a
      third. FogPassTests covers the one part of this that a test can reach without a device, which is
      which rows a frame copies; getting that wrong leaves a row showing last frame's fog, and a
      player reads that as vision they do not have. Nothing calls the pass yet - App.cpp is G2's.

