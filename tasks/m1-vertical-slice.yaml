# Schema: Design/ImplementationPlan.md §3    Validate: python3 Tools/CheckTaskDag.py tasks/m1-vertical-slice.yaml
#
# Commands under `verify` that name msbuild, vstest or RunClangTidy are what CI runs on the pull
# request; an agent session runs on Linux and reads their result off the PR (ImplementationPlan.md §2).

plan: m1-vertical-slice
title: M1 Vertical slice - two commanders on a Small landscape build, design, research and fight to annihilation over loopback
phase: 1
summary: >
  What M1 proves (GameDesign.md §12): two commanders, one human and one scripted, on a Small
  landscape build extractors, generators, a factory and a lab, design a device and fight to
  annihilation, with a host thread and the loopback transport in one process and the client a
  replica from the first slice (owner, 2026-09-17). Content is one landscape, five structures
  and one defence, three chassis, three drives, four modules, thirty research items, a
  fixed-panel interface per Design/Interface.md, Net and Replica over loopback, one scripted AI,
  the damage and visibility models complete, and the M1 tables checked by the cost-efficiency
  script.

  Task ids carry a letter for the layer so that a reader can see the shape: D design, C content,
  S simulation, N net, R replica, K client (engine), G game executable. Every task is blocked by
  the M0 task that gives it its library; the checker shows those as "held by another plan" until
  M0 lands.

  What this plan deliberately leaves to M2, so that nobody adds it here: audio, the sprite
  pass and particles, water with waves, the sky and clouds, Eclipse-shaped windows (M1 has fixed
  panels), save and resume, a lobby, hover, walls and hardpoints, and every module not in the
  four. Projectiles are small geometry instances and an explosion is a sound-less wreck.

  Placeholders: the owner makes the models (owner, 2026-09-17), and until they exist every
  model is a generated primitive with markers, so that composition at markers is exercised
  rather than faked. The Species palettes, icons and the Spectrum font come across under
  the provenance ADR.

