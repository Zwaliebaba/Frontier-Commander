      - Host publishes a frame per client every second tick, delta-encoded against the newest frame the client acknowledged, keeps 32 frames of history per client, sends a full frame when the baseline has fallen out of history or at join, and splits any frame over 1,200 bytes of payload into numbered fragments
      - "Join, rejoin with the same token, leave and timeout per §5.4, with the seat handed to AI control after the grace period MatchSettings gives; ReceiveOrders() hands validated-shape orders to Sim's queue for the next tick"
      - "The interest test: in a scripted match over LoopbackTransport, for every frame to every client, no record names an object outside the seat's visibility, own objects or ghost store, and no fog delta names another seat's cells"
      - "The conversation tests over loopback: join and full frame, deltas against an acked baseline, a lost frame recovered by the next delta, a full frame after history exhaustion, fragmentation and reassembly of a large frame, a slow client dropped to AI"
      - The network ADR records the model as decided, the publish rate, history length, quantisation and fragment size, the leak posture of §5.2, and the bytes per frame measured in the tests at 100 and 600 visible objects
    verify:
      - python3 Tools/CheckTaskDag.py
      - python3 Build/CheckFormat.py --clang-format clang-format-18
      - python3 Build/CheckProjectFiles.py
      - msbuild FrontierCommander.slnx /p:Configuration=Debug /p:Platform=x64 /m /warnaserror
      - vstest.console.exe x64\Debug\*Tests.dll /Platform:x64
    parallel_safe: true
    status: done
    notes: >
      Net/Host is the host end, Net/Interest the filter it publishes through, Net/FrameEncoder what
      turns a simulation and an interest set into one client's frame, Net/ClientHistory the 32 it
      keeps, and Net/Fragmenter what splits a frame too large for a datagram. ADR-012 records the
      model and every number, measured.

      THE INTEREST SET IS THE SECURITY BOUNDARY AND THE ENCODER IS SHAPED AROUND IT. The encoder
      reads the simulation only for ids the interest set names, so the only way a record of an
      unseen object could reach a frame is through a set that named it - which is what makes the
      guarantee testable rather than reviewable. InterestTests plays a scripted match with two
      commanders who never see each other and asserts that neither was told of a seat, a device, a
      structure or a seat state but his own, and that the fog each was sent equals HIS OWN grid cell
      for cell rather than the alliance's union.

      ONE THING §5.3 DOES NOT HAVE AND THE PROTOCOL NEEDED. The acknowledgement rides every datagram
      the client sends, and a frame the client DISCARDS now forces another one. Without it: the
      client applies frame N, its acknowledgement is lost, the host goes on encoding against N-1,
      the client goes on discarding what arrives because the baseline is not what it holds, and the
      two talk past each other until the next heartbeat twenty ticks later. A discarded frame is
      evidence the host's idea of this client is stale, so it is exactly what should make the client
      say so again. Found by a test that dropped a third of the link, not by reading.

      MEASURED, and it is what ADR-012 quotes: a full frame at 100 visible objects is 3,653 bytes
      and a delta with half of them moving 637 (6 KB/s at 10 Hz); at 600 objects, 19,153 and 3,387
      (33 KB/s). A fifth under TechnicalDesign.md §5.7's arithmetic, because a device that did not
      move sends nothing and a changed one sends only what its mask names. The 32-frame history is
      therefore 600 KB a client at 600 objects, which is the figure to reopen the history length
      against.

      MatchSettings gains rejoinGraceTicks, which the acceptance asks for and the lobby had no field
      for; GameDesign.md §10 asks for a grace period and gives no number, so the default is two
      minutes. Snapshot version 15 carries it.

      Measured: NetTests 49 passed, 0 failed; SimTests still 143.

  - id: N3
    title: Net client endpoint - frames in, acknowledgements, the reliable order stream
    intent: >
      The client end of the conversation (TechnicalDesign.md §5.5) receives frames and
      fragments, acknowledges what it applied, and delivers orders reliably through loss, so
      that Replica has frames and the host has orders with nothing else in between.
    project: Net
    depends_on: [N1]
    files:
      - Net/Client.h
      - Net/Client.cpp
      - Net/Reassembler.h
      - Net/Reassembler.cpp
      - Net/ReliableStream.h
      - Net/ReliableStream.cpp
      - Net/Net.vcxproj
      - Net/Net.vcxproj.filters
      - Tests/NetTests/ClientTests.cpp
      - Tests/NetTests/ReliableStreamTests.cpp
      - Tests/NetTests/NetTests.vcxproj
      - Tests/NetTests/NetTests.vcxproj.filters
    acceptance:
      - Client joins through the transport, reassembles fragments and discards a frame with one missing, hands complete frames to a sink in sequence order and acknowledges the newest applied sequence in every datagram it sends
      - "ReliableStream carries orders with sequence numbers, cumulative acknowledgements in every datagram, and resend after a round-trip estimate; duplicates are dropped and delivery is in order; the host side of the stream lives in N2's Host and is exercised here"
      - "Tests over loopback with seeded loss, duplication and reorder: every order arrives once and in order; a frame with a lost fragment is skipped and the next delta recovers; the round-trip estimate converges"
    verify:
      - python3 Tools/CheckTaskDag.py
      - python3 Build/CheckFormat.py --clang-format clang-format-18
      - python3 Build/CheckProjectFiles.py
      - msbuild FrontierCommander.slnx /p:Configuration=Debug /p:Platform=x64 /m /warnaserror
      - vstest.console.exe x64\Debug\*Tests.dll /Platform:x64
    parallel_safe: true
    status: done
    notes: >
      Net/Client is the client end, Net/Reassembler puts a fragmented frame back together and
      Net/ReliableStream carries the orders. Both halves of the stream are one class, because a
      conversation has a sending and a receiving half at both ends and the acknowledgement one half
      produces is the one the other consumes; N2's Host holds the other instance.

      TWO THINGS THE DESIGN DID NOT SPELL OUT AND THE CODE HAD TO. Karn's rule: an order that was
      SENT TWICE measures no round trip, because there is no telling which copy the acknowledgement
      answers, and taking the last send would measure a trip that never happened - a lossy link
      otherwise talks itself into an estimate far shorter than the link, resends more, and gets
      lossier. And the estimate is held in EIGHTHS of a tick: in whole ticks a smoothed average
      over eight samples cannot move at all for a sample within eight of the estimate, so it would
      sit on its initial guess for ever. Measured: it walks from the initial 8 down to 5 on a link
      of 4.

      WHEN A PARTIAL FRAME IS GIVEN UP ON. §5.3 says a frame with a fragment missing is discarded,
      and the question it leaves is when. Two answers, both here: a third frame arriving while two
      are part-way through displaces the older, and a frame that COMPLETES discards every partial
      older than itself - the host encodes its next frame against what this one acknowledged, so
      the missing piece would complete a frame nothing is a delta from any more. No timer, and
      nothing to tune.

      A frame is applied when it is full or when its baseline is exactly what this client last
      applied; anything else is dropped and the unmoved acknowledgement is what tells the host. The
      Join is the one message with no acknowledgement of its own, so it is the one repeated on a
      schedule of its own; everything else rides the frame acknowledgement.

      Measured: NetTests 28 passed, 0 failed. Sixty orders over a link losing a twelfth, duplicating
      a twentieth and reordering a tenth arrive exactly once and in order; twenty orders over the
      real LoopbackTransport dropping a fifth take 47 datagrams and 12 resends.

  - id: R1
    title: Replica world and interpolation, with the convergence tests
    intent: >
      The client's world model (TechnicalDesign.md §2, §5) applies frames into a replica that is
      a faithful reading of the host's interest set and interpolates it 100 milliseconds behind,
      so that the client draws what the host said and a test proves it converges with and
      without loss.
    project: Replica
    depends_on: [N3]
    files:
      - Replica/Replica.h
      - Replica/Replica.cpp
      - Replica/ReplicaObject.h
