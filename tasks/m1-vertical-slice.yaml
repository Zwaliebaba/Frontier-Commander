      across the footprint is under 25%" reads as the relief over how far the footprint reaches, and
      that is what was written; Landscape::Cell's slopePercent - the steepest step between two
      adjacent samples - was rejected in a comment as "much harsher". Measured over the 795 dry
      three-by-three sites of the built-in Small landscape, the average gradient refuses 4 of them
      and the steepest cell refuses 31, so the harshness was 3.4% of the map rather than a wall, and
      the objection was arithmetic nobody had done. Two things then decide it: 25 is the same number
      and the same unit GameData\Components.json gives Wheels for maxSlopePercent, which is read per
      cell; and what the steepest cell refuses and the average waves through is a footprint
      straddling a CLIFF EDGE, eight gentle cells and one vertical one, which is exactly the site a
      factory must not stand on. PlacementTests pins the reading with a case the other one accepts.
      THE FLATTEN NO LONGER BLACKS OUT THE MAP. S9 dropped every stamp and every fog grid on a
      height delta and left the narrowing to this task, which is the one that actually flattens - and
      it flattens every time a structure goes up, so the explored history of every commander would
      have gone with it. Visibility::InvalidateRegion un-counts only the discs that REACH the
      changed cells, before the heights move; a disc that does not reach them cannot have a cell
      changed by them, so it is exact and not an approximation. VisibilityTests now pins both halves.
      THE BUILD ACCUMULATOR IS EFFORT AND NOT A PERCENTAGE. Structure::buildProgressHundredths
      became buildEffortHundredths because a percentage per tick does not divide: a hundred percent
      over a 1,200-tick factory is 8.33 hundredths a tick, and a truncated percentage reaches 9,600
      and stops. The builders' own contribution accumulates exactly, and the percentage the hit
      points and the refund want is a function of it. Snapshot version 9 carries it and the two
      module fields.
