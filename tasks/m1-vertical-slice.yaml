      factory has a queue, so for a factory the entry cannot say which countdown is its.
      TWO UPGRADE EFFECTS HAD NOWHERE TO GO. ResearchEffect has ExtractorRate and StructureHitPoints
      and ClassUpgrades had a slot for neither, so they are two more fields on it rather than two
      more places an upgrade can live: one home for "what research has done to this commander" is
      what makes a derivation trustworthy. Economy reads the first where an extractor yields;
      Research reads the second where a structure's maximum is wanted.
      THE UNLOCK EFFECT DOES NOTHING, AND THAT IS NOT AN OMISSION. A row says what unlocks it and an
      item says what it unlocks; the simulation reads the first (UnlockedFor), so an item joining
