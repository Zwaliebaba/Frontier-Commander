      TWO TYPES CALLED Frontier::DeviceDesign, AND THIS IS THE TASK THAT HAD TO SEE BOTH. Content's
      named its parts by id for the design screen and for saving between matches; Sim's named them
      by row index because a design is hashed and sent every tick. Neither file included the other,
