  - id: K5
    title: Make the frame time measurable - an unlocked present and a readout
    intent: >
      m0-foundation/T22 asked the owner for the frame time at 1920x1080 and got 8 to 16 ms, which
      is the display's refresh and not the renderer's cost: Client/SwapChain.cpp presents with
      Present(1, 0) and nothing turns that off, and the client reports no frame time anywhere, so
      the figure had to come from outside the process. A milestone whose acceptance is a measured
      frame time needs the client able to measure one.
    project: Client
    depends_on: []
    files:
      - Client/SwapChain.h
      - Client/SwapChain.cpp
      - Client/FrameTimer.h
      - Client/FrameTimer.cpp
      - Client/Client.vcxproj
