      ContentValidator checks, and a second mechanism would be a second thing to keep in step.
      WHAT AN UPGRADE WALKS THE WORLD FOR is one thing only: the current hit points. Everything
      derived is read from the seat's upgrades wherever it is wanted (S5), so a percentage landing
      there already reaches every fielded device; what has to be rescaled is the damage a device is
      carrying, because a device at half health must still be at half health when its maximum grows.
